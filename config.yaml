# Konfiguracja Invest Radar. Edytuj watchlistę pod swoje konta (Erste, XTB / IKE).
# Symbole w formacie Yahoo Finance: GPW = .WA, Frankfurt = .DE, Amsterdam = .AS, Londyn = .L
# UWAGA: sprawdź w swoim brokerze, czy dany instrument jest dostępny (zwłaszcza ETF-y pod IKE).

settings:
  horizons: [long, medium]     # long = lata (IKE), medium = tygodnie-miesiące
  cache_ttl_hours: 6           # jak długo trzymać pobrane dane
  min_confidence: 0.30         # poniżej tego sygnał spada do TRZYMAJ
  hysteresis: 0.05             # sygnał z poprzedniego skanu zostaje, dopóki score/pewność nie wyjdą o tyle poza próg
  insiders: true               # transakcje insiderów (USA: SEC Form 4 - wymaga SEC_USER_AGENT; GPW: przybliżone z newsów)
  insider_days: 90             # okno analizy transakcji
  insider_weight: 0.15         # siła nakładki insiderów na score (dane przybliżone ważą o połowę mniej)

# Alerty po skanie z flagą --notify (kanały w .env: Telegram i/lub e-mail)
alerts:
  min_confidence: 0.40         # nowy sygnał do działania musi mieć co najmniej taką pewność
  alert_on_first_run: false    # pierwszy skan nie wysyła alertów (nie ma z czym porównać)

# Wagi składowych per horyzont (technika / fundamenty / newsy+makro). Usuń sekcję, by użyć domyślnych.
weights:
  long:   {tech: 0.25, fund: 0.45, news: 0.30}
  medium: {tech: 0.40, fund: 0.20, news: 0.40}

# Zapytania do Google News dla kontekstu makro i geopolityki
macro_queries:
  - "geopolityka rynki finansowe"
  - "inflacja stopy procentowe NBP Fed EBC"
  - "giełda GPW WIG20"
  - "Wall Street S&P 500"
  - "ceny ropy gazu surowce"
  - "cła wojna handlowa gospodarka"
  - "global markets stocks outlook"

