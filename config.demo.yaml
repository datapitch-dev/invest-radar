# Konfiguracja trybu demo: fikcyjne instrumenty, żeby syntetyczne sygnały nie wyglądały jak ocena prawdziwych spółek.
# Używana automatycznie przez `python scan.py --demo` i `RADAR_DEMO=1 streamlit run app.py`.

settings:
  horizons: [long, medium]
  cache_ttl_hours: 6
  min_confidence: 0.30
  hysteresis: 0.05
  insiders: false

alerts:
  min_confidence: 0.40
  alert_on_first_run: false

macro_queries:
  - "rynki finansowe"
  - "stopy procentowe"

watchlist:
  - {symbol: ALFA.WA,  name: Alfa Energia,     kind: stock, market: GPW,    sector: Energy,     query: "Alfa Energia"}
  - {symbol: BETA.WA,  name: Beta Bank,        kind: stock, market: GPW,    sector: Financials, query: "Beta Bank"}
  - {symbol: GAMA.WA,  name: Gama Games,       kind: stock, market: GPW,    sector: Technology, query: "Gama Games"}
  - {symbol: DELTA.WA, name: Delta Market,     kind: stock, market: GPW,    sector: Consumer,   query: "Delta Market"}
  - {symbol: OMGA,     name: Omega Chips,      kind: stock, market: USA,    sector: Technology, query: "Omega Chips"}
  - {symbol: SGMA,     name: Sigma Oil,        kind: stock, market: USA,    sector: Energy,     query: "Sigma Oil"}
  - {symbol: KPPA,     name: Kappa Financial,  kind: stock, market: USA,    sector: Financials, query: "Kappa Financial"}
  - {symbol: LMBD.DE,  name: Lambda Software,  kind: stock, market: Europa, sector: Technology, query: "Lambda Software"}
  - {symbol: TAU.AS,   name: Tau Materials,    kind: stock, market: Europa, sector: Materials,  query: "Tau Materials"}
  - {symbol: WRLD.DE,  name: Demo World ETF,   kind: etf,   market: ETF,    sector: Global,     query: "Demo World ETF"}
  - {symbol: US5H.DE,  name: Demo US 500 ETF,  kind: etf,   market: ETF,    sector: Global,     query: "Demo US 500 ETF"}
